etb.block.column=Column
etb.prop.content=Content
etb.prop.content.desc=Edit here or click the text on the canvas and type. Merge fields such as #currentUser.firstName# are filled in when the email is sent; their values are HTML-escaped.
etb.prop.align=Align
etb.prop.fontSize=Font size (px)
etb.prop.color=Colour
etb.prop.color.inherit=Leave empty to use the template theme.
etb.prop.padding=Padding
etb.prop.button.innerPadding=Space inside the button
etb.prop.button.innerPadding.desc=In px, around the label, e.g. 12 24. Smaller for buttons side by side, such as a 1 to 5 scale.
etb.prop.padding.desc=In px: one to four values, as in CSS, e.g. 8 32 (8px top and bottom, 32px at the sides).
etb.prop.label=Label
etb.prop.href=Link
etb.prop.href.desc=http, https, mailto, tel or cid links only. Merge fields allowed.
etb.prop.backgroundColor=Background colour
etb.prop.textColor=Text colour
etb.prop.borderRadius=Corner radius (px)
etb.prop.thickness=Thickness (px)
etb.prop.widthPercent=Width (%)
etb.prop.height=Height (px)
etb.prop.columnWidth=Width
etb.prop.columnWidth.desc=With its unit: 50% or 200px. Leave empty to share the row equally.
etb.prop.verticalAlign=Vertical align
etb.align.left=Left
etb.align.center=Centre
etb.align.right=Right
etb.valign.top=Top
etb.valign.middle=Middle
etb.valign.bottom=Bottom
etb.template.contentBorderRadius=Corner radius (px)
etb.template.contentBorderRadius.desc=Rounds the email's content card, e.g. 8px. Classic Outlook on Windows shows square corners.
etb.template.contentShadow=Shadow
etb.template.contentShadow.desc=A soft shadow around the content card. Shown by Apple Mail and some webmail; Outlook desktop ignores it.
etb.block.html=Custom HTML
etb.html.warning.title=Fields in your HTML
etb.html.warning=Hash variables (#...#), {var.xxx} and {row.xxx} are supported. Hash variables go in as HTML; add ?html to {var.xxx} or {row.xxx} for the same. Keep values people type (form input) in a Text block.
etb.prop.html=HTML
etb.prop.textBackground.desc=Fills the block's full width, e.g. a coloured header or footer band.
etb.prop.borderColor=Border colour
etb.prop.borderColor.desc=Leave empty for no border.
etb.prop.borderWidth=Border width (px)
etb.block.image=Image
etb.prop.src=Image URL
etb.prop.src.desc=Pick or upload an image from App Resources (it is embedded in the email, so no public server URL is needed), or type an absolute https URL or cid:FILE_NAME. Merge fields allowed in URLs.
etb.prop.alt=Alt text
etb.prop.alt.desc=Shown when images are blocked (the default in many clients) and read by screen readers.
etb.prop.imageHref=Link
etb.prop.imageWidth=Width (px)
etb.prop.imageWidth.desc=In px, e.g. 120px for a logo. Leave empty to fill the column.
etb.prop.placeholderHeight=Placeholder height (px)
etb.prop.placeholderHeight.desc=Height of the grey box shown while no image URL is set.
etb.starter.label=Start from
etb.starter.choose=Choose a template…
etb.prop.keepSideBySide=Keep side by side on mobile
etb.prop.keepSideBySide.desc=Columns normally stack on phones. Tick for short content that must stay in one line, such as Approve / Reject buttons.
etb.email=Email
etb.style.button=Email style
etb.style.hint=Colours, corners, shadow, font and width of the whole email
etb.tool.title=Send Templated Email
etb.tool.template=Email template
etb.tool.template.desc=The template to send. Its merge fields are filled in with this process's data.
etb.tool.subject.desc=Leave empty to use the template's subject.
etb.block.hero=Hero
etb.prop.headline=Headline
etb.prop.heroText=Text
etb.prop.buttonLabel=Button label
etb.prop.buttonLabel.desc=Leave empty for no button.
etb.prop.heroBackground=Background & style
etb.prop.backgroundUrl=Background image URL
etb.prop.backgroundUrl.desc=Pick or upload from App Resources (linked through the template's Public server address; the file must be public), or type an absolute https URL. Use a dark or plain image so the text stays readable; many clients block images until the reader allows them.
etb.prop.backgroundPosition=Image position
etb.position.top=Top
etb.position.center=Centre
etb.position.bottom=Bottom
etb.prop.heroBackgroundColor.desc=Shown while the image is blocked or loading. Pick a colour the text is readable on.
etb.prop.headlineSize=Headline size (px)
etb.prop.buttonColor=Button colour
etb.prop.buttonTextColor=Button text colour
etb.prop.heroHeight=Height (px)
etb.prop.heroHeight.desc=In px, e.g. 300px. Long text on a phone may need more.
etb.block.navbar=Navbar
etb.prop.links=Links
etb.prop.links.desc=Shown in one line (wrapping on phones). Merge fields allowed.
etb.prop.linkColor=Link colour
etb.prop.bold=Bold
etb.prop.linkPadding=Space around each link
etb.prop.linkPadding.desc=In px: one to four values, as in CSS, e.g. 8 12.
etb.block.datalistTable=Datalist Table
etb.prop.listId=Datalist
etb.prop.listId.desc=Read as the process's user, so the datalist's permissions apply. The canvas shows the column headers; Preview and Send test show real rows.
etb.prop.columns=Columns
etb.prop.columns.desc=Pick and order the columns to show (for cards: extra 'label: value' lines). Leave empty for all visible columns.
etb.prop.filters=Filters
etb.prop.filters.desc=Each row keeps only records where the field equals the value, e.g. order_id = #form.orders.id# for an order's line items. Leave empty for a digest of the whole list. Merge fields allowed in values. Rows that don't match are always left out, even if the datalist's data source ignores filters (e.g. JSON API without "handle filters").
etb.prop.filterField=Field
etb.prop.filterValue=Equals
etb.prop.sortBy=Sort by
etb.prop.sortDesc=Newest / largest first
etb.prop.maxRows=Maximum rows
etb.prop.maxRows.desc=1 to 100. Every row makes the email bigger; Gmail cuts off emails over about 102 KB.
etb.prop.cellMode=Cell values
etb.prop.cellMode.desc=Formatted text runs the column formatters and keeps the text. Formatter HTML keeps their markup (colours, badges), which may look different in email apps. Raw shows stored values.
etb.cellMode.text=Formatted text
etb.cellMode.html=Formatter HTML
etb.cellMode.raw=Raw values
etb.prop.emptyText=When there are no rows
etb.prop.tableStyle=Table style
etb.prop.headerBackground=Header background
etb.prop.headerTextColor=Header text colour
etb.prop.striped=Striped rows
etb.template.publicUrl=Public server address
etb.template.publicUrl.desc=The address recipients can reach this Joget server at, e.g. https://apps.example.com/jw. Used for Hero background images picked from App Resources (email apps load backgrounds by URL, not from attachments). Merge fields allowed, e.g. #envVariable.publicUrl#.
etb.prop.layout=Layout
etb.layout.table=Table
etb.layout.cards=Cards (one per row)
etb.prop.cardTitle=Card title
etb.prop.cardLink=Title link
etb.prop.cardLink.desc=A column holding a URL (http, https or mailto); the title links to it.
etb.prop.cardSubtitle=Card subtitle
etb.prop.cardBody=Card body
etb.prop.cardBody.desc=Shown under the details. With Cell values set to Formatter HTML it keeps lists and formatting.
etb.prop.cardBackground=Card background
etb.prop.titleColor=Title colour
etb.prop.cardGap=Space between cards (px)
etb.block.repeat=Repeat
etb.prop.repeat.listId.desc=The blocks inside are repeated once per row. Read as the process's user, so the datalist's permissions apply. Preview and Send test show real rows.
etb.prop.repeat.fields=Row fields
etb.prop.repeat.fields.desc=Write these in the blocks inside the Repeat (Text, Button, Image, ...); each copy of the blocks gets its row's values. A Datalist Table inside, filtered by {row.id}, gives each row its own list.
etb.prop.repeat.style=Card style
etb.prop.repeat.card=Draw each row as a card
etb.block.outside=Outside the card
etb.prop.outside.hint=Where it goes
etb.prop.outside.hint.value=First in the email: above the card (e.g. a logo). Last: below it (e.g. address, "Questions?"). In the middle: it splits the email into two cards.
etb.prop.outside.padding.desc=Space around its blocks, e.g. 24px 0px. The blocks inside keep their own padding.
etb.prop.outside.bg.desc=Leave empty for the email's page background.
etb.prop.filterParams=Datalist filter parameters
etb.prop.filterParams.desc=The datalist's own filters, as its page URL passes them, so its filter types apply (date range, select, contains, ...). Name: the filter's name, e.g. fn_dateCreated (a name copied from a URL such as d-4040985-fn_dateCreated works too). Give a name twice for a range's from and to, e.g. fn_dateCreated = #date.DAY-1.yyyy-MM-dd# and fn_dateCreated = #date.DAY-0.yyyy-MM-dd#. Merge fields, {var.NAME} (template variables) and, in a Repeat's nested table, {row.NAME} allowed in values. The datalist's data source applies these, so rows are not re-checked as with Filters.
etb.prop.filterParamName=Filter name
etb.prop.filterParamValue=Value
etb.template.variables=Template variables
etb.template.variables.desc=Values the sender gives the email, used as {var.NAME} anywhere (subject, text, links, filter parameters, Repeat cards). Send Templated Email maps each one (e.g. boardId = {id} inside an Iterator). To preview with values, set them in Test data (toolbar).
etb.template.variables.name=Name
etb.template.variables.description=Description
etb.tool.variables=Template variables
etb.tool.variables.desc=A value for each of the template's variables ({var.NAME}). Merge fields allowed; inside an Iterator Process Tool, {column} of the iterated record. A variable left out is sent empty.
etb.tool.variables.name=Variable
etb.tool.variables.value=Value
etb.prop.repeat.cardPadding=Card padding
etb.prop.repeat.cardPadding.desc=Space inside each card, around its blocks, e.g. 6px 0px or 0px. The blocks inside keep their own padding too.
etb.prop.repeat.padding.desc=Space around the cards (outside them), e.g. 12px 24px: above the first card, beside the cards, below the last.
etb.block.steps=Steps
etb.prop.steps=Steps
etb.prop.steps.desc=In order, up to 7. "Also matches": other values of the current-step field that mean this step, separated by commas (e.g. In review, Approved).
etb.prop.steps.matches=Also matches
etb.prop.steps.current=Current step
etb.prop.steps.current.desc=A step number (1, 2, ...) or a field such as #form.request.status#. Text is matched, ignoring case, against each step's label and its "Also matches" values. Earlier steps show as done. 0 = not started; a number above the last step = all done.
etb.prop.steps.previewStep=Step shown in the builder
etb.prop.steps.previewStep.desc=Used on the canvas while the current step is a field, and in Preview when that field is empty. Never in a sent email.
etb.prop.steps.lastDone=Reaching the last step completes it
etb.prop.steps.doneMark=Done steps show
etb.prop.steps.doneMark.check=A check mark
etb.prop.steps.doneMark.number=Their number
etb.prop.steps.color=Done and current colour
etb.prop.steps.mutedColor=Upcoming colour
etb.prop.steps.labelColor=Done label colour
etb.prop.steps.mutedLabelColor=Upcoming label colour
etb.block.progressBars=Progress bars
etb.prop.bars=Bars
etb.prop.bars.desc=Value: a percentage (86 or 86%) or a fraction (12/20), typed or a field such as #form.project.progress#. Colour: a hex colour, or empty for the bar colour below.
etb.prop.bars.value=Value
etb.prop.bars.showValue=Show the value
etb.prop.bars.previewValue=Value shown in the builder
etb.prop.bars.previewValue.desc=Used on the canvas while a value is a field, and in Preview when that field is empty. Never in a sent email.
etb.prop.bars.color=Bar colour
etb.prop.bars.trackColor=Remaining colour
etb.prop.bars.height=Bar height (px)
etb.prop.bars.rounded=Rounded ends
etb.prop.bars.labelColor=Label colour
etb.block.badge=Badge
etb.prop.badge.text=Text
etb.prop.badge.text.desc=A few words, initials or an emoji. Fields work, e.g. &#9679;&nbsp; #form.request.status#.
etb.prop.badge.shape=Shape
etb.prop.badge.shape.pill=Pill
etb.prop.badge.shape.circle=Circle
etb.prop.badge.shape.rounded=Rounded square
etb.prop.badge.size=Circle size (px)
etb.prop.badge.size.desc=Width and height of a circle, e.g. 44px. Pills and squares size to their text.
etb.prop.badge.spaced=Spaced letters
etb.block.callout=Callout
etb.prop.callout.style=Style
etb.prop.callout.style.box=Soft box
etb.prop.callout.style.bar=Box with a coloured left bar
etb.prop.callout.style.dashed=Dashed box
etb.prop.callout.style.quote=Quote
etb.prop.callout.icon=Icon
etb.prop.callout.icon.desc=Optional: a symbol shown before the title, such as a check mark or a warning sign. Emoji look informal and some email apps draw them flat or as boxes.
etb.prop.callout.title=Title
etb.prop.callout.title.desc=Optional. In the Quote style it is the attribution, shown under the quote.
etb.prop.callout.text=Text
etb.prop.callout.text.desc=HTML allowed. Fields work, e.g. #form.reset.code#.
etb.prop.callout.code=Large code text
etb.prop.callout.code.desc=Shows the text big, monospaced and spaced out, e.g. a one-time code.
etb.prop.callout.accentColor=Accent colour
etb.prop.callout.titleColor=Title colour
etb.block.statTiles=Stat tiles
etb.prop.tiles=Tiles
etb.prop.tiles.desc=Up to 4, side by side; on phones they stack. Icon (optional): a symbol or a short word above the number. A number can be a field, e.g. {var.tasksDone}. Colours: hex, e.g. #EEF2FF.
etb.prop.tiles.number=Number
etb.prop.tiles.keepSideBySide.desc=Tiles normally stack on phones. Tick for short numbers that fit side by side, such as 3 tiles of 2 to 3 digits.
etb.prop.tiles.caption=Caption
etb.prop.tiles.color=Number colour
etb.prop.tiles.numberSize=Number size (px)
etb.prop.tiles.captionColor=Caption colour
etb.prop.tiles.borderColor.desc=Optional: a 1px border around each tile.
etb.prop.tiles.tilePadding=Space inside a tile (px)
etb.prop.tiles.gap=Space between tiles (px)
etb.block.facts=Facts list
etb.prop.facts=Rows
etb.prop.facts.desc=A label and a value per row. Values are usually fields, e.g. #form.request.status#; HTML allowed.
etb.prop.facts.hideEmpty=Hide rows with an empty value
etb.prop.facts.labelStyle=Label style
etb.prop.facts.labelStyle.caps=Small spaced capitals
etb.prop.facts.labelStyle.plain=Plain
etb.prop.facts.labelStyle.mono=Monospaced capitals (memo)
etb.prop.facts.valueAlign=Value position
etb.prop.facts.valueAlign.right=On the right
etb.prop.facts.valueAlign.left=Beside the label
etb.prop.facts.labelWidth=Label width (%)
etb.prop.facts.labelWidth.desc=The label column, e.g. 35%. Long values wrap in the rest.
etb.prop.facts.dividers=Dividers between rows
etb.prop.facts.dividerColor=Divider colour
etb.prop.facts.labelColor=Label colour
etb.prop.facts.valueColor=Value colour
etb.block.timeline=Timeline
etb.prop.timeline.items=Items
etb.prop.timeline.items.desc=In order. Time is optional (the column is left out when no item has one). Dot colour: optional hex, else the block's. Fields work.
etb.prop.timeline.time=Time
etb.prop.timeline.detail=Detail
etb.prop.timeline.color=Dot and time colour
etb.prop.timeline.filledDots=Filled dots
etb.prop.timeline.lineColor=Line colour
etb.prop.timeline.detailColor=Detail colour
etb.prop.timeline.timeWidth=Time column width (px)
etb.prop.timeline.dotColor=Dot colour
etb.prop.timeline.monoTime=Monospaced times
